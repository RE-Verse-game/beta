name: Deploy to GitHub Pages

# Publishes the static browser build (repo root) to GitHub Pages on every
# push to main. No build step — the game is plain HTML/CSS/JS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enable Pages (GitHub Actions source) if not set
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # entire repo root is the site
      - id: deployment
        uses: actions/deploy-pages@v4
